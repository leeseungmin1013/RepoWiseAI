name: Production maintenance

on:
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:

concurrency:
  group: production-maintenance
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  maintenance:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      APP_ENV: production
      SERVICE_NAME: repowise-maintenance
      DATABASE_URL: ${{ secrets.MAINTENANCE_DATABASE_URL }}
      QUOTA_ENFORCEMENT_MODE: "off"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Run maintenance
        run: uv run --project apps/api --locked --no-dev python -m app.workers.maintenance
