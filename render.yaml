services:
  - type: keyvalue
    name: repowise-queue
    region: singapore
    plan: free
    ipAllowList: []
    maxmemoryPolicy: noeviction
    persistenceMode: off

  - type: web
    name: repowise-api
    runtime: docker
    region: singapore
    plan: free
    numInstances: 1
    previews:
      generation: off
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health/ready
    envVars:
      - key: APP_ENV
        value: staging
      - key: SERVICE_NAME
        value: repowise-api
      - key: AUTH_REQUIRED
        value: "true"
      - key: ANALYSIS_WORKSPACE
        value: /tmp/repowise/repositories
      - key: HEALTHCHECK_TIMEOUT_SECONDS
        value: "2"
      - key: DATABASE_URL
        sync: false
      - key: MIGRATION_DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: repowise-queue
          property: connectionString
      - key: CORS_ORIGINS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWT_ISSUER
        sync: false
      - key: SUPABASE_JWKS_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: DEFAULT_ORGANIZATION_ID
        sync: false
      - key: EXACT_SNAPSHOT_REUSE_ENABLED
        value: "true"
      - key: INCREMENTAL_ANALYSIS_ENABLED
        value: "true"
      - key: SEMANTIC_CACHE_WRITE_ENABLED
        value: "true"
      - key: SEMANTIC_CACHE_READ_ENABLED
        value: "true"
      - key: SEMANTIC_CACHE_SHADOW_MODE
        value: "true"
      - key: NAVIGATION_LLM_LABELS_ENABLED
        value: "false"
      - key: QUOTA_ENFORCEMENT_MODE
        value: "off"
      - key: DEFAULT_MONTHLY_ALLOWANCE_MICRO_USD
        value: "250000"
      - key: REALTIME_MAX_DURATION_SECONDS
        value: "300"
      - key: ANALYSIS_QUEUE_STALL_SECONDS
        value: "120"
      - key: ANALYSIS_PROGRESS_STALL_SECONDS
        value: "180"
      - key: ANALYSIS_HEARTBEAT_INTERVAL_SECONDS
        value: "15"
      - key: ANALYSIS_JOB_TIMEOUT_SECONDS
        value: "1800"
      - key: ANALYSIS_MAX_RETRIES
        value: "3"
      - key: WORKER_HEARTBEAT_STALE_SECONDS
        value: "180"

  - type: worker
    name: repowise-worker
    runtime: docker
    region: singapore
    preDeployCommand: python -m app.migrate
    plan: starter
    numInstances: 1
    previews:
      generation: off
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: python -m app.workers.runner
    maxShutdownDelaySeconds: 300
    envVars:
      - key: APP_ENV
        value: staging
      - key: SERVICE_NAME
        value: repowise-worker
      - key: AUTH_REQUIRED
        value: "true"
      - key: ANALYSIS_WORKSPACE
        value: /tmp/repowise/repositories
      - key: DATABASE_URL
        sync: false
      - key: MIGRATION_DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: repowise-queue
          property: connectionString
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWT_ISSUER
        sync: false
      - key: SUPABASE_JWKS_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: DEFAULT_ORGANIZATION_ID
        sync: false
      - key: EXACT_SNAPSHOT_REUSE_ENABLED
        value: "true"
      - key: INCREMENTAL_ANALYSIS_ENABLED
        value: "true"
      - key: SEMANTIC_CACHE_WRITE_ENABLED
        value: "true"
      - key: SEMANTIC_CACHE_READ_ENABLED
        value: "true"
      - key: SEMANTIC_CACHE_SHADOW_MODE
        value: "true"
      - key: NAVIGATION_LLM_LABELS_ENABLED
        value: "false"
      - key: QUOTA_ENFORCEMENT_MODE
        value: "off"
      - key: DEFAULT_MONTHLY_ALLOWANCE_MICRO_USD
        value: "250000"
      - key: REALTIME_MAX_DURATION_SECONDS
        value: "300"
      - key: QUEUE_RECOVERY_STALE_SECONDS
        value: "900"
      - key: QUEUE_RECOVERY_BATCH_SIZE
        value: "500"
      - key: QUEUE_RECOVERY_INTERVAL_SECONDS
        value: "60"
      - key: ANALYSIS_QUEUE_STALL_SECONDS
        value: "120"
      - key: ANALYSIS_PROGRESS_STALL_SECONDS
        value: "180"
      - key: ANALYSIS_HEARTBEAT_INTERVAL_SECONDS
        value: "15"
      - key: ANALYSIS_JOB_TIMEOUT_SECONDS
        value: "1800"
      - key: ANALYSIS_MAX_RETRIES
        value: "3"
      - key: WORKER_HEARTBEAT_STALE_SECONDS
        value: "180"
      - key: OPENAI_TIMEOUT_SECONDS
        value: "60"
      - key: OPENAI_MAX_RETRIES
        value: "2"
      - key: EMBEDDING_BATCH_MAX_INPUTS
        value: "64"
      - key: EMBEDDING_BATCH_MAX_CHARACTERS
        value: "240000"
